services:
  remote-agent-console:
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.144.5}
    restart: unless-stopped
    init: true
    # The application intentionally binds to loopback. Host networking keeps
    # that boundary while making 127.0.0.1:8787 reachable from the host.
    network_mode: host
    env_file:
      - .env
    environment:
      RAC_CONFIG: /workspace/config/remote-agent-console.docker.json
      RAC_CONFIG_WRITE_PATH: /workspace/config/remote-agent-console.docker.json
      # linux host networking reaches project ports through loopback
      RAC_PROJECT_PROXY_HOST: ${RAC_PROJECT_PROXY_HOST:-127.0.0.1}
      RAC_DEVICE_NAMES_FILE: /workspace/.data/device-names.json
      RAC_SAVED_PROMPTS_FILE: /workspace/.data/saved-prompts.json
      RAC_PROMPT_HISTORY_FILE: /workspace/.data/prompt-history.json
      RAC_QUEUED_PROMPTS_FILE: /workspace/.data/queued-prompts.json
      RAC_NOTES_FILE: /workspace/.data/notes.json
      RAC_BOOKMARKS_FILE: /workspace/.data/bookmarks.json
      RAC_REVIEW_TOURS_FILE: /workspace/.data/review-tours.json
      RAC_INTEGRATION_AUTH_FILE: /workspace/.data/integration-auth.json
      RAC_INTEGRATION_STATE_FILE: /workspace/.data/integration-state.json
      RAC_INTEGRATION_AUDIT_FILE: /workspace/.data/integration-audit.jsonl
    volumes:
      - ./:/workspace:rw
      - codex-home:/home/node/.codex
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    # The host configuration and tunnel credential are intentionally
    # owner-readable only. Run this sidecar as root so its read-only bind mounts
    # remain usable without weakening their host permissions.
    user: "0:0"
    restart: unless-stopped
    # keep the connector independent while reaching the loopback-only origin
    network_mode: host
    depends_on:
      remote-agent-console:
        condition: service_healthy
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - type: bind
        source: ./config/cloudflared.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLOUDFLARED_CREDENTIALS_FILE:-./config/cloudflared.credentials.json}
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false

volumes:
  codex-home:
