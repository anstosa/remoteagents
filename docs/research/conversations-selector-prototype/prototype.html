<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE — Conversations selector</title>
<!--
  PROTOTYPE — throwaway, standalone. Three structurally different Conversations controls
  for the Remote Agent Console, drawn inside a fake console frame so they can be judged in
  context. Open the file directly; switch with ?variant=A|B|C or the floating bar.
    A  Fly-out + More dialog — name field on top, five "named here" rows, More… opens a
       searchable dialog with "Named here" / "All named" sections.
    B  One sheet — a single bottom sheet (side drawer on desktop): editable title in the
       header, search first, "named here" as chips, everything else grouped by age.
    C  Title chip + browse — the current name is a chip in the footer stack (tap to rename),
       a list button shows only console-named rows, Browse all… opens a dialog with kind
       tabs and a flat list.
  Scenarios (?scenario=): idle, working, question, duplicate, scratch, empty, unlaunchable.
-->
<style>
:root { --base:#1e1e2e; --mantle:#181825; --crust:#11111b; --surface0:#313244; --surface1:#45475a; --surface2:#585b70; --overlay0:#6c7086; --overlay1:#7f849c; --subtext0:#a6adc8; --subtext1:#bac2de; --text:#cdd6f4; --mauve:#cba6f7; --blue:#89b4fa; --green:#a6e3a1; --peach:#fab387; --sky:#89dceb; --teal:#94e2d5; --red:#f38ba8; --yellow:#f9e2af; --lavender:#b4befe; --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; --radius:.3rem; --edge:1rem; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--crust); color:var(--text); font:14px/1.4 var(--mono); }
button, input { font:inherit; color:inherit; }
button { cursor:pointer; border:1px solid var(--surface1); border-radius:var(--radius); background:color-mix(in srgb, var(--mantle) 88%, transparent); color:var(--subtext0); padding:.3rem .5rem; }
button:hover:not(:disabled) { color:var(--text); }
button:disabled { cursor:not-allowed; opacity:.55; }
input { border:1px solid var(--surface2); border-radius:var(--radius); background:color-mix(in srgb, var(--surface0) 82%, transparent); color:var(--text); padding:.45rem .6rem; min-width:0; }
input:focus { outline:2px solid var(--sky); outline-offset:0; }
svg { width:1.1rem; height:1.1rem; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ---- fake console frame ---- */
.console { position:fixed; inset:0; display:grid; grid-template-rows:minmax(0,1fr) auto auto auto auto; background:var(--base); }
.log { position:relative; overflow:hidden; background:var(--base); }
.switcher { position:absolute; top:.4rem; left:.4rem; display:flex; gap:.4rem; align-items:center; padding:.3rem .4rem; border:1px solid var(--surface1); border-radius:var(--radius); background:color-mix(in srgb, var(--crust) 88%, transparent); font-size:.8rem; }
.switcher span { padding:.3rem .6rem; border:1px solid var(--surface1); border-radius:var(--radius); color:var(--mauve); }
.switcher span.active { color:var(--text); background:var(--surface0); }
.live { position:absolute; top:3.3rem; left:.4rem; padding:.3rem .7rem; border-radius:999px; background:var(--green); color:var(--crust); font-weight:800; font-size:.8rem; }
.pane { position:absolute; left:var(--edge); right:5rem; bottom:.6rem; color:var(--text); font-size:.9rem; white-space:pre-wrap; }
.pane b { color:var(--blue); font-weight:400; }
.pane i { color:var(--lavender); font-style:normal; }
.pane em { color:var(--yellow); font-style:normal; }
.page-controls { position:absolute; right:.375rem; bottom:.45rem; display:grid; gap:.375rem; justify-items:end; }
.page-controls > button:not(.title-chip), .ctl { display:grid; width:2.6rem; min-height:2.6rem; padding:.25rem; place-items:center; }
.lock { display:inline-block; width:.85rem; height:.85rem; stroke:var(--peach); }
.badge { position:absolute; top:-.45rem; right:-.45rem; display:grid; min-width:1.2rem; height:1.2rem; place-items:center; border-radius:999px; background:var(--mauve); color:var(--crust); font-size:.65rem; font-weight:800; }
.ctl-wrap { position:relative; }
.ctl.active { border-color:var(--mauve); color:var(--mauve); }
.statusline { display:flex; justify-content:space-between; align-items:center; padding:.35rem var(--edge); border-top:1px solid var(--surface0); background:var(--mantle); color:var(--subtext0); font-size:.8rem; }
.statusline b { color:var(--text); }
.tabs { display:flex; border-top:1px solid var(--surface0); background:var(--mantle); }
.tabs > div { flex:1 1 auto; display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.7rem .5rem; color:var(--subtext0); border-right:1px solid var(--surface0); font-size:.9rem; }
.tabs > div.active { color:var(--green); background:var(--surface0); box-shadow:inset 0 0 0 1px var(--blue); }
.tabs > div.plus { flex:0 0 3.2rem; color:var(--blue); font-size:1.4rem; }
.composer { min-height:5.5rem; margin:.4rem var(--edge) 0; border:1px solid var(--surface1); border-radius:var(--radius); background:var(--mantle); }
.actions { display:flex; align-items:center; gap:.4rem; padding:.4rem var(--edge) .6rem; }
.actions > button { display:grid; width:2.8rem; height:2.8rem; place-items:center; }
.actions .power { border-color:var(--red); color:var(--red); }
.actions .send { border-color:var(--blue); background:color-mix(in srgb, var(--blue) 60%, var(--surface0)); color:var(--crust); }
.actions .spacer { flex:1; }

/* ---- kind marks ---- */
.mark { display:inline-grid; flex:none; width:1.05rem; height:1.05rem; place-items:center; border-radius:.25rem; background:color-mix(in srgb, var(--kind, var(--lavender)) 22%, transparent); color:var(--kind, var(--lavender)); font-size:.66rem; font-weight:800; }
.k-claude { --kind:var(--peach); } .k-codex { --kind:var(--green); } .k-omx { --kind:var(--teal); } .k-pi { --kind:var(--sky); }

/* ---- overlays ---- */
.backdrop { position:fixed; inset:0; z-index:300; background:transparent; }
.backdrop.dim { background:color-mix(in srgb, var(--crust) 72%, transparent); backdrop-filter:blur(4px); }
.flyout { position:fixed; z-index:310; display:grid; width:min(22rem, calc(100vw - 4.5rem)); max-height:min(70vh, 30rem); gap:.35rem; overflow:auto; padding:.4rem; border:1px solid color-mix(in srgb, var(--mauve) 48%, var(--surface1)); border-radius:var(--radius); background:color-mix(in srgb, var(--mantle) 96%, transparent); box-shadow:0 .8rem 2rem color-mix(in srgb, var(--crust) 80%, transparent); }
.heading { margin:.25rem .25rem 0; color:var(--overlay1); font-size:.6rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
.empty { margin:0; padding:.45rem .5rem; color:var(--subtext0); font-size:.7rem; line-height:1.4; }
.name-form { display:grid; grid-template-columns:minmax(0,1fr) 2.4rem; gap:.3rem; }
.name-form input { min-height:2.4rem; border-color:color-mix(in srgb, var(--mauve) 55%, var(--surface1)); font-size:.8rem; }
.name-form > button { display:grid; width:2.4rem; min-height:2.4rem; padding:0; place-items:center; border-color:color-mix(in srgb, var(--mauve) 68%, var(--surface1)); color:var(--mauve); }
.name-form small { grid-column:1 / -1; padding:0 .1rem; color:var(--subtext0); font-size:.64rem; line-height:1.35; }
.row { display:grid; grid-template-columns:minmax(0,1fr) 2.4rem; overflow:hidden; border:1px solid var(--surface1); border-radius:var(--radius); background:color-mix(in srgb, var(--surface0) 52%, transparent); }
.row.current { border-color:color-mix(in srgb, var(--mauve) 72%, var(--surface1)); background:color-mix(in srgb, var(--mauve) 12%, var(--surface0)); box-shadow:inset .18rem 0 var(--mauve); }
.row.current strong { color:var(--mauve); }
.row > .choice { display:flex; min-height:3.2rem; align-items:center; border:0; border-radius:0; padding:.5rem .6rem; background:transparent; text-align:left; }
.row .details { display:grid; gap:.15rem; min-width:0; }
.row .details strong { display:flex; align-items:center; gap:.4rem; font-size:.8rem; line-height:1.3; overflow-wrap:anywhere; }
.row .details small { color:var(--subtext0); font-size:.64rem; }
.row > .remove { display:grid; place-items:center; border:0; border-left:1px solid var(--surface1); border-radius:0; background:transparent; color:var(--subtext0); }
.more { display:flex; width:100%; min-height:2.6rem; align-items:center; justify-content:space-between; gap:.5rem; border-color:color-mix(in srgb, var(--mauve) 45%, var(--surface1)); font-size:.8rem; }
.more small { color:var(--subtext0); font-size:.68rem; }
.notice { display:flex; align-items:center; gap:.55rem; margin:0; border:1px solid color-mix(in srgb, var(--yellow) 60%, var(--surface1)); border-radius:var(--radius); padding:.55rem .7rem; background:color-mix(in srgb, var(--yellow) 12%, var(--surface0)); color:var(--yellow); font-size:.76rem; line-height:1.35; font-weight:700; }
.notice svg { flex:none; width:1.1rem; height:1.1rem; }
.tools .notice { margin-top:.1rem; }
.spinner { display:inline-block; width:1rem; height:1rem; border:2px solid var(--surface2); border-top-color:var(--mauve); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* list rows shared by the dialog and the sheet */
.list { display:grid; min-height:0; align-content:start; gap:.3rem; overflow:auto; padding:.6rem 1rem 1rem; }
.list section { display:grid; gap:.3rem; }
.lrow { display:grid; width:100%; height:auto; min-height:3rem; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:.6rem; border:1px solid var(--surface1); border-radius:var(--radius); padding:.5rem .65rem; background:color-mix(in srgb, var(--surface0) 52%, transparent); color:var(--text); text-align:left; white-space:normal; }
.lrow:hover:not(:disabled) { border-color:color-mix(in srgb, var(--mauve) 60%, var(--surface1)); }
.lrow.current { border-color:color-mix(in srgb, var(--mauve) 72%, var(--surface1)); background:color-mix(in srgb, var(--mauve) 12%, var(--surface0)); box-shadow:inset .18rem 0 var(--mauve); opacity:1; }
.lrow .copy { display:grid; min-width:0; gap:.15rem; }
.lrow .copy strong { font-size:.84rem; line-height:1.3; overflow-wrap:anywhere; }
.lrow.automatic .copy strong { color:var(--subtext1); font-style:italic; font-weight:600; }
.lrow .copy small { color:var(--subtext0); font-size:.66rem; line-height:1.35; }
.pill { flex:none; border:1px solid color-mix(in srgb, var(--mauve) 60%, var(--surface1)); border-radius:999px; padding:.1rem .45rem; color:var(--mauve); font-size:.58rem; font-weight:700; font-style:normal; letter-spacing:.06em; text-transform:uppercase; }
.pill.cur { border-color:color-mix(in srgb, var(--green) 60%, var(--surface1)); color:var(--green); }
.pill.star { border:0; padding:0; font-size:1rem; }

/* dialog (A, C) */
.dialog { position:fixed; inset:0; z-index:500; display:grid; place-items:center; padding:1rem; background:color-mix(in srgb, var(--crust) 85%, transparent); backdrop-filter:blur(5px); }
.dialog > div { display:grid; width:min(36rem, 100%); height:min(88vh, 46rem); grid-template-rows:auto auto minmax(0,1fr) auto; overflow:hidden; border:1px solid color-mix(in srgb, var(--mauve) 48%, var(--surface1)); border-radius:var(--radius); background:var(--base); box-shadow:0 1.5rem 4rem color-mix(in srgb, var(--crust) 80%, transparent); }
.dialog header { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.85rem 1rem; border-bottom:1px solid var(--surface1); }
.dialog header small { color:var(--mauve); font-size:.66rem; font-weight:700; letter-spacing:.14em; }
.dialog header h2 { margin:.15rem 0 0; font-size:1.1rem; }
.dialog header > button, .sheet-close { width:2rem; height:2rem; padding:0; border-color:transparent; background:transparent; font-size:1.3rem; }
.tools { display:grid; gap:.5rem; padding:.6rem 1rem; border-bottom:1px solid var(--surface1); }
.search { width:100%; min-height:2.5rem; font-size:.9rem; }
.tabsrow { display:flex; gap:.3rem; overflow-x:auto; scrollbar-width:none; }
.tabsrow button { display:inline-flex; flex:none; min-height:2rem; align-items:center; gap:.35rem; border-radius:999px; padding:.25rem .7rem; font-size:.72rem; font-weight:700; }
.tabsrow button[aria-selected="true"] { border-color:var(--mauve); background:color-mix(in srgb, var(--mauve) 18%, var(--surface0)); color:var(--mauve); }
.dialog footer { display:flex; align-items:center; gap:.75rem; padding:.6rem 1rem; border-top:1px solid var(--surface1); }
.dialog footer > span { color:var(--overlay1); font-size:.66rem; line-height:1.35; }
.dialog footer > button { margin-left:auto; padding:.6rem 1.2rem; background:linear-gradient(135deg, var(--mauve), var(--blue)); color:var(--crust); font-weight:700; border-color:transparent; }
@media (max-width:600px) { .dialog { padding:0; } .dialog > div { width:100vw; height:100dvh; border:0; border-radius:0; } }

/* sheet (B) */
.sheet-wrap { position:fixed; inset:0; z-index:500; display:grid; align-items:end; }
.sheet { position:relative; z-index:400; display:grid; max-height:min(88vh, calc(100dvh - 1rem)); grid-template-rows:auto auto auto minmax(0,1fr); border:1px solid color-mix(in srgb, var(--mauve) 48%, var(--surface1)); border-bottom:0; border-radius:.9rem .9rem 0 0; background:var(--base); box-shadow:0 -1rem 3rem color-mix(in srgb, var(--crust) 80%, transparent); animation:up .18s ease-out; }
@keyframes up { from { transform:translateY(2rem); opacity:0; } }
.sheet-head { display:flex; align-items:center; gap:.5rem; padding:.7rem .8rem .5rem; }
.sheet-title { display:flex; flex:1 1 auto; min-width:0; min-height:3rem; align-items:center; gap:.6rem; border-color:transparent; padding:.4rem .5rem; background:transparent; color:var(--text); text-align:left; }
.sheet-title:hover:not(:disabled) { border-color:color-mix(in srgb, var(--mauve) 50%, var(--surface1)); background:color-mix(in srgb, var(--surface0) 60%, transparent); }
.sheet-title > span { display:grid; min-width:0; gap:.1rem; }
.sheet-title strong { overflow:hidden; font-size:1rem; text-overflow:ellipsis; white-space:nowrap; }
.sheet-title > span.automatic strong { color:var(--subtext1); font-style:italic; font-weight:600; }
.sheet-title small { color:var(--subtext0); font-size:.66rem; }
.sheet-title svg { flex:none; width:1rem; height:1rem; stroke:var(--mauve); }
.sheet > .search { width:auto; margin:0 .8rem .5rem; }
.chips { display:flex; gap:.4rem; overflow-x:auto; padding:0 .8rem .6rem; scrollbar-width:none; }
.chips > .empty { padding:0 .1rem .2rem; }
.chip { display:inline-flex; flex:none; max-width:16rem; align-items:stretch; overflow:hidden; border:1px solid color-mix(in srgb, var(--mauve) 60%, var(--surface1)); border-radius:999px; background:color-mix(in srgb, var(--mauve) 10%, var(--surface0)); }
.chip.current { border-color:var(--mauve); box-shadow:inset 0 0 0 1px var(--mauve); }
.chip button { display:inline-flex; min-height:2.1rem; align-items:center; gap:.35rem; border:0; border-radius:0; padding:.2rem .35rem .2rem .55rem; background:transparent; color:var(--text); font-size:.74rem; font-weight:700; white-space:nowrap; }
.chip button:first-child { overflow:hidden; text-overflow:ellipsis; }
.chip button:last-child { padding:0 .55rem 0 .35rem; border-left:1px solid color-mix(in srgb, var(--mauve) 35%, var(--surface1)); color:var(--subtext0); }
.sheet .list { padding-top:.2rem; }
@media (min-width:601px) { .sheet-wrap { justify-items:end; align-items:stretch; } .sheet { width:27rem; max-height:none; border-radius:0; border-bottom:1px solid var(--surface1); border-right:0; animation-name:inright; } @keyframes inright { from { transform:translateX(2rem); opacity:0; } } }

/* inline rename (B header, C chip) */
.inline-name { display:grid; flex:1 1 auto; min-width:0; grid-template-columns:minmax(0,1fr) 2.2rem 2.2rem; gap:.25rem; align-items:center; }
.inline-name input { min-height:2.4rem; border-color:var(--mauve); font-size:.84rem; }
.inline-name button { display:grid; width:2.2rem; min-height:2.4rem; padding:0; place-items:center; color:var(--mauve); }
.inline-name button:last-of-type { color:var(--subtext0); }
.inline-name small { grid-column:1 / -1; color:var(--subtext0); font-size:.64rem; }

/* title chip (C) */
.title-chip { display:flex; max-width:min(15rem, calc(100vw - 6rem)); min-height:2.6rem; align-items:center; gap:.4rem; padding:.3rem .55rem .3rem .5rem; border-color:color-mix(in srgb, var(--mauve) 55%, var(--surface1)); color:var(--text); font-size:.78rem; }
.title-chip > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.title-chip.automatic > span { color:var(--subtext0); font-style:italic; font-weight:600; }
.title-chip svg { flex:none; width:.9rem; height:.9rem; stroke:var(--mauve); }
.chip-edit { width:min(18rem, calc(100vw - 6rem)); }

/* floating prototype bar — deliberately not part of the design */
.bar-wrap { position:fixed; top:.5rem; left:50%; z-index:2000; transform:translateX(-50%); }
.bar { display:flex; align-items:center; gap:.35rem; padding:.3rem .5rem; border:2px solid #f5c2e7; border-radius:999px; background:#111; color:#fff; box-shadow:0 .5rem 1.5rem #000c; font-size:.72rem; font-weight:700; white-space:nowrap; }
.bar-tag { padding:.1rem .4rem; border-radius:999px; background:#f5c2e7; color:#111; font-size:.58rem; letter-spacing:.12em; }
.bar button { min-height:1.6rem; padding:.1rem .5rem; border:1px solid #555; border-radius:999px; background:#222; color:#fff; }
.bar strong span { color:#bbb; font-weight:600; }
.bar label { display:inline-flex; align-items:center; gap:.3rem; color:#bbb; }
.bar select { border:1px solid #555; border-radius:.3rem; background:#222; color:#fff; font:inherit; }
.state { position:fixed; top:3rem; right:.5rem; z-index:2000; width:min(30rem, calc(100vw - 1rem)); max-height:60vh; overflow:auto; border:1px solid #f5c2e7; border-radius:.5rem; padding:.5rem .75rem; background:#111; color:#eee; font-size:.66rem; line-height:1.4; }
.state h3 { margin:.4rem 0 .2rem; color:#f5c2e7; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; }
.state pre { margin:0; white-space:pre-wrap; }
.state ol { margin:0; padding-left:1.2rem; }
.state li small { display:inline-block; margin-right:.4rem; color:#888; }
@media (max-width:600px) { .bar-wrap { top:auto; bottom:5.8rem; left:.4rem; transform:none; } .bar { gap:.25rem; padding:.2rem .35rem; font-size:.64rem; opacity:.92; } .bar-tag, .bar strong span { display:none; } .bar label { font-size:0; } .bar select { max-width:7.5rem; font-size:.64rem; } .state { top:auto; bottom:8.2rem; max-height:45vh; } }
</style>
</head>
<body>
<div class="console">
  <div class="log">
    <div class="switcher"><span>☏ Call Davo</span><span class="active">Remote Agents</span><span>⚙</span></div>
    <div class="live">Live</div>
    <div class="pane" id="pane"></div>
    <div class="page-controls" id="controls"></div>
  </div>
  <div class="statusline"><span>⟲</span><span><b>main</b> · status unavailable</span></div>
  <div class="tabs" id="tabs"></div>
  <div class="composer"></div>
  <div class="actions"><button class="power" aria-label="Power"><svg viewBox="0 0 24 24"><path d="M12 3v9M18.4 6.6a9 9 0 1 1-12.8 0"/></svg></button><span class="spacer"></span><button aria-label="More">⋮</button><button aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5zM8 4v5h7V4M8 20v-6h8v6"/></svg></button><button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 12 21 4l-4 16-5-7-9-1Z"/></svg></button></div>
</div>
<div id="overlay"></div>
<div id="bar"></div>

<script>
// ---------- model ----------
const minute = 60000, hour = 60 * minute, day = 24 * hour, now = Date.now();
const seed = () => [
  { id: 'c-01', kind: 'claude', name: 'Named sessions selector', automatic: false, lastActiveAt: now - 4 * minute, worktree: 'named-sessions', consoleNamed: true },
  { id: 'c-02', kind: 'codex', name: 'Silent launch collision fix', automatic: false, lastActiveAt: now - 2 * hour, worktree: 'main', consoleNamed: true },
  { id: 'c-03', kind: 'claude', name: 'Bottom status bar', automatic: false, lastActiveAt: now - 26 * hour, worktree: 'bottom-status-bar', consoleNamed: true },
  { id: 'c-04', kind: 'pi', name: 'Pi adapter recognizer', automatic: false, lastActiveAt: now - 3 * day, worktree: 'pi-adapter', consoleNamed: true },
  { id: 'c-05', kind: 'omx', name: 'OMX ZFS pointer cleanup', automatic: false, lastActiveAt: now - 9 * day, worktree: 'main', consoleNamed: true },
  { id: 'c-06', kind: 'claude', name: 'Scheduled prompts charting', automatic: false, lastActiveAt: now - 12 * day, worktree: 'scheduled-prompts', consoleNamed: true },
  { id: 'c-07', kind: 'claude', name: 'Fix blank terminal after backgrounding', automatic: true, lastActiveAt: now - 40 * minute, worktree: 'main', consoleNamed: false },
  { id: 'c-08', kind: 'codex', name: 'Wrap toast notice text on desktop', automatic: true, lastActiveAt: now - 5 * hour, worktree: 'main', consoleNamed: false },
  { id: 'c-09', kind: 'claude', name: 'Latte theme', automatic: false, lastActiveAt: now - 2 * day, worktree: 'latte', consoleNamed: false },
  { id: 'c-10', kind: 'codex', name: 'Install bubblewrap for Debian', automatic: true, lastActiveAt: now - 4 * day, worktree: 'sandbox', consoleNamed: false },
  { id: 'c-11', kind: 'omx', name: 'Respond to greeting', automatic: true, lastActiveAt: now - 6 * day, worktree: 'main', consoleNamed: false },
  { id: 'c-12', kind: 'claude', name: 'Investigate 409 on bookmark resume', automatic: true, lastActiveAt: now - 8 * day, worktree: 'main', consoleNamed: false },
  { id: 'c-13', kind: 'pi', name: 'Refactor auth module', automatic: false, lastActiveAt: now - 15 * day, worktree: 'main', consoleNamed: false },
  { id: 'c-14', kind: 'codex', name: 'Yield pane size to attached clients', automatic: true, lastActiveAt: now - 20 * day, worktree: 'yield-pane', consoleNamed: false },
  { id: 'c-15', kind: 'claude', name: 'Direct spawn groundwork', automatic: true, lastActiveAt: now - 30 * day, worktree: 'direct-spawn', consoleNamed: false },
  { id: 'c-16', kind: 'codex', name: "Let's make the install script instal", automatic: true, lastActiveAt: now - 33 * day, worktree: 'sandbox', consoleNamed: false },
  { id: 'c-17', kind: 'claude', name: 'Security audit follow-ups', automatic: true, lastActiveAt: now - 41 * day, worktree: 'main', consoleNamed: false },
  { id: 'c-18', kind: 'omx', name: 'Split OMX into its own kind', automatic: false, lastActiveAt: now - 45 * day, worktree: 'omx-kind', consoleNamed: false },
  { id: 'c-19', kind: 'claude', name: 'Inline questions via reported channel', automatic: true, lastActiveAt: now - 52 * day, worktree: 'main', consoleNamed: false },
  { id: 'c-20', kind: 'pi', name: 'Mock provider for probes', automatic: true, lastActiveAt: now - 60 * day, worktree: 'pi-adapter', consoleNamed: false }
];
const kinds = { claude: { glyph: '✳', label: 'Claude' }, codex: { glyph: '◆', label: 'Codex' }, omx: { glyph: '◈', label: 'OMX' }, pi: { glyph: 'π', label: 'Pi' } };
const variants = ['A', 'B', 'C'];
const variantName = { A: 'Fly-out + More dialog', B: 'One sheet with search', C: 'Title chip + browse' };
const scenarios = { idle: 'Agent idle', working: 'Agent working', question: 'Agent asking', duplicate: 'Two agents on worktree', scratch: 'Scratch agent', empty: 'Nothing named here yet', unlaunchable: 'Pi not configured' };
const params = new URLSearchParams(location.search);
const requestedVariant = (params.get('variant') || 'A').toUpperCase();
const S = {
  variant: variants.includes(requestedVariant) ? requestedVariant : 'A',
  scenario: params.get('scenario') in scenarios ? params.get('scenario') : 'idle',
  conversations: seed(), currentId: 'c-01', pendingId: undefined, log: [],
  open: null, editing: false, query: '', kind: 'all', panel: false
};
const stamp = () => new Date().toLocaleTimeString();
const logLine = text => { S.log.unshift({ at: stamp(), text }); S.log.length = Math.min(S.log.length, 30); };
const writeUrl = () => { const p = new URLSearchParams(location.search); p.set('variant', S.variant); p.set('scenario', S.scenario); history.replaceState(null, '', `${location.pathname}?${p}`); };
const setVariant = v => { S.variant = v; S.open = null; S.editing = false; writeUrl(); render(); };
const applyScenario = s => { S.scenario = s; S.conversations = seed(); S.pendingId = undefined; S.open = null; S.editing = false; if (s === 'empty') S.conversations.forEach(c => { c.consoleNamed = false; }); S.currentId = s === 'empty' ? 'c-07' : 'c-01'; };
const setScenario = s => { applyScenario(s); logLine(`scenario → ${scenarios[s]}`); writeUrl(); render(); };
if (S.scenario === 'empty') applyScenario('empty');

// ---------- selectors ----------
const byRecency = (a, b) => b.lastActiveAt - a.lastActiveAt;
const allNamed = () => [...S.conversations].sort(byRecency);
const consoleNamed = () => allNamed().filter(c => c.consoleNamed);
const current = () => S.conversations.find(c => c.id === S.currentId);
const record = () => S.conversations.filter(c => c.consoleNamed).map(c => ({ kind: c.kind, id: c.id }));
const resumeBlock = c => {
  if (c.id === S.currentId) return 'This is the current conversation';
  if (S.pendingId !== undefined) return 'Another conversation is opening';
  if (S.scenario === 'scratch') return 'Resume is not available for scratch agents';
  if (S.scenario === 'working') return 'The agent is working — wait for the turn to finish';
  if (S.scenario === 'question') return 'The agent is asking a question — answer it first';
  if (S.scenario === 'duplicate') return 'Close the other agent on this worktree first';
  if (S.scenario === 'unlaunchable' && c.kind === 'pi') return 'Pi is not configured on this host';
  return undefined;
};
// a block that applies to every row at once is said once, at the top, not on each row
const globalBlock = () => S.scenario === 'scratch' ? 'Resume is not available for scratch agents.' : S.scenario === 'working' ? 'The agent is working — resume is unavailable until the turn finishes.' : S.scenario === 'question' ? 'The agent is asking a question — answer it before resuming another conversation.' : S.scenario === 'duplicate' ? 'Two agents are open on this worktree — close one before resuming another conversation.' : undefined;
const notice = () => { const text = globalBlock(); return text ? `<p class="notice" role="status"><svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><span>${esc(text)}</span></p>` : ''; };
const matches = (c, q, kind) => (kind === 'all' || c.kind === kind) && (q === '' || c.name.toLowerCase().includes(q) || kinds[c.kind].label.toLowerCase().includes(q) || c.worktree.toLowerCase().includes(q));
const relativeAge = at => { const e = Date.now() - at; if (e < minute) return 'just now'; if (e < hour) return `${Math.round(e / minute)} min ago`; if (e < day) return `${Math.round(e / hour)} h ago`; const d = Math.round(e / day); if (d === 1) return 'yesterday'; if (d < 14) return `${d} d ago`; return `${Math.round(d / 7)} wk ago`; };
const ageGroup = at => { const d = Math.floor((Date.now() - at) / day); return d < 1 ? 'Today' : d < 2 ? 'Yesterday' : d < 7 ? 'This week' : d < 30 ? 'This month' : 'Earlier'; };
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

// ---------- actions ----------
const nameCurrent = name => {
  const c = current(); if (!c) return;
  Object.assign(c, { name, automatic: false, consoleNamed: true, lastActiveAt: Date.now() });
  logLine(`submitted rename → "${name}" (${S.scenario === 'working' ? 'queued behind the running turn' : 'applied'}); record += ${c.id}`);
  S.editing = false; render();
};
const forget = id => { const c = S.conversations.find(x => x.id === id); if (c) c.consoleNamed = false; logLine(`record -= ${id} (the conversation keeps its name)`); render(); };
const resume = id => {
  const c = S.conversations.find(x => x.id === id); if (!c || resumeBlock(c)) return;
  S.pendingId = id; logLine(`resume ${id} (${c.kind}) → closing the idle agent and launching ${c.kind} --resume`); render();
  setTimeout(() => { c.lastActiveAt = Date.now(); S.currentId = id; S.pendingId = undefined; S.open = null; logLine(`agent now on "${c.name}"`); render(); }, 700);
};

// ---------- pieces ----------
const mark = k => `<span class="mark k-${k}" title="${kinds[k].label}" aria-hidden="true">${kinds[k].glyph}</span>`;
const icon = { tag: '<svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8L3 12Z"/><circle cx="7.5" cy="8.5" r="1.4"/></svg>', list: '<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>', pencil: '<svg viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16l-1 4ZM14 7l3 3"/></svg>', check: '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>', x: '<svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>', note: '<svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z M16 4v3h3"/></svg>', up: '<svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>', down: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>' };
const nameHint = () => {
  const c = current(); const human = c && !c.automatic ? c.name : '';
  return S.scenario === 'working' ? 'Sent to the agent now; applies after the current turn' : S.scenario === 'question' ? 'Sent after the question is answered' : human ? 'Renames the current conversation' : c ? `Now: “${esc(c.name)}” (automatic title)` : '';
};
const nameForm = () => { const c = current(); const human = c && !c.automatic ? c.name : ''; return `<form class="name-form" data-action="name"><input aria-label="Conversation name" name="name" value="${esc(human)}" placeholder="Name this conversation" maxlength="120"><button type="submit" aria-label="Save conversation name" title="Save name">${icon.check}</button><small>${nameHint()}</small></form>`; };
const inlineName = cls => { const c = current(); const human = c && !c.automatic ? c.name : ''; return `<form class="inline-name ${cls}" data-action="name"><input aria-label="Conversation name" name="name" value="${esc(human)}" placeholder="Name this conversation" maxlength="120"><button type="submit" aria-label="Save conversation name">${icon.check}</button><button type="button" aria-label="Cancel rename" data-action="cancel-edit">${icon.x}</button>${S.scenario === 'working' ? '<small>Applies after the current turn</small>' : ''}</form>`; };
const quickRow = c => { const block = resumeBlock(c); const cur = c.id === S.currentId; return `<div class="row${cur ? ' current' : ''}"><button class="choice" type="button" ${block ? 'disabled' : ''} title="${esc(block || `Resume “${c.name}”`)}" data-action="resume" data-id="${c.id}" ${cur ? 'aria-current="true"' : ''}>${S.pendingId === c.id ? '<span class="spinner"></span>' : `<span class="details"><strong>${mark(c.kind)}${esc(c.name)}</strong><small>${relativeAge(c.lastActiveAt)} · ${esc(c.worktree)}${cur ? ' · current' : ''}</small></span>`}</button><button class="remove" type="button" aria-label="Remove ${esc(c.name)} from this list" title="Remove from this list (the conversation keeps its name)" data-action="forget" data-id="${c.id}">${icon.x}</button></div>`; };
const listRow = (c, badge) => { const block = resumeBlock(c); const cur = c.id === S.currentId; const tail = S.pendingId === c.id ? '<span class="spinner"></span>' : cur ? '<em class="pill cur">current</em>' : c.consoleNamed && badge === 'text' ? '<em class="pill">named here</em>' : c.consoleNamed && badge === 'star' ? '<em class="pill star" aria-label="Named here">★</em>' : ''; return `<button class="lrow${c.automatic ? ' automatic' : ''}${cur ? ' current' : ''}" type="button" ${block ? 'disabled' : ''} ${cur ? 'aria-current="true"' : ''} title="${esc(block || `Resume “${c.name}”`)}" data-action="resume" data-id="${c.id}">${mark(c.kind)}<span class="copy"><strong>${esc(c.name)}</strong><small>${kinds[c.kind].label} · ${relativeAge(c.lastActiveAt)} · ${esc(c.worktree)}${c.automatic ? ' · automatic title' : ''}${block && !cur && block !== globalBlock() && !globalBlock() ? ` · ${esc(block)}` : ''}</small></span>${tail}</button>`; };

// ---------- the footer control per variant ----------
const controlButton = (glyph, label, count) => `<div class="ctl-wrap"><button class="ctl${S.open === 'flyout' || S.open === 'sheet' ? ' active' : ''}" type="button" id="ctl" aria-label="${label}" title="Conversations" aria-expanded="${S.open !== null}" data-action="toggle">${glyph}${count > 0 ? `<span class="badge" aria-hidden="true">${count}</span>` : ''}</button></div>`;
const renderControl = () => {
  const named = consoleNamed(); const c = current();
  let control;
  if (S.variant === 'C') {
    const chip = S.editing ? inlineName('chip-edit') : `<button type="button" class="title-chip${c && c.automatic ? ' automatic' : ''}" title="${esc(c ? (c.automatic ? `“${c.name}” is an automatic title — tap to name this conversation` : 'Tap to rename this conversation') : '')}" data-action="edit">${c ? mark(c.kind) : ''}<span>${esc(c ? c.name : 'Unnamed conversation')}</span>${icon.pencil}</button>`;
    control = chip + controlButton(icon.list, `Named conversations (${named.length})`, named.length);
  } else control = controlButton(icon.tag, `Conversations (${named.length} named here)`, named.length);
  document.getElementById('controls').innerHTML = `${control}<button class="ctl" aria-label="Notes">${icon.note}</button><button class="ctl" aria-label="Page up">${icon.up}</button><button class="ctl" aria-label="Page down">${icon.down}</button>`;
};

// ---------- overlays ----------
const flyoutHtml = () => {
  const named = consoleNamed(); const quick = named.slice(0, 5);
  if (S.variant === 'C') return `${quick.length === 0 ? '<p class="empty">Name a conversation with the title chip and it shows up here.</p>' : quick.map(quickRow).join('')}<button class="more" type="button" data-action="dialog"><span>Browse all…</span><small>${allNamed().length}</small></button>`;
  return `${nameForm()}${notice()}${quick.length > 0 ? `<p class="heading">Named here</p>${quick.map(quickRow).join('')}` : '<p class="empty">Nothing named here yet. Name the current conversation above, or browse all of them.</p>'}<button class="more" type="button" data-action="dialog"><span>All conversations</span><small>${allNamed().length}</small></button>`;
};
const dialogList = () => {
  const q = S.query.trim().toLowerCase(); const all = allNamed().filter(c => matches(c, q, S.kind));
  if (S.variant === 'C') return `${all.length === 0 ? '<p class="empty">No matches.</p>' : ''}${all.map(c => listRow(c, 'star')).join('')}`;
  const here = all.filter(c => c.consoleNamed), rest = all.filter(c => !c.consoleNamed);
  return `${here.length > 0 ? `<p class="heading">Named here</p>${here.map(c => listRow(c, 'none')).join('')}` : ''}<p class="heading">All named conversations</p>${rest.length === 0 ? '<p class="empty">No matches.</p>' : ''}${rest.map(c => listRow(c, 'none')).join('')}`;
};
const dialogHtml = () => `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div><header><div><small>CORA</small><h2 id="dlg-title">Conversations</h2></div><button type="button" aria-label="Close conversations" data-action="close">×</button></header><div class="tools"><input class="search" type="search" aria-label="Search conversations" placeholder="Search by name, agent, or branch" value="${esc(S.query)}" data-action="search">${S.variant === 'C' ? `<div class="tabsrow" role="tablist" aria-label="Agent kind">${['all', 'claude', 'codex', 'omx', 'pi'].map(k => `<button type="button" role="tab" aria-selected="${S.kind === k}" data-action="kind" data-kind="${k}">${k === 'all' ? 'All' : `${mark(k)}${kinds[k].label}`}</button>`).join('')}</div>` : ''}${notice()}</div><div class="list" id="list">${dialogList()}</div><footer><span id="count"></span><button type="button" data-action="close">Close</button></footer></div></div>`;
const sheetList = () => {
  const q = S.query.trim().toLowerCase(); const list = allNamed().filter(c => matches(c, q, 'all'));
  const groups = new Map(); list.forEach(c => { const k = ageGroup(c.lastActiveAt); groups.set(k, [...(groups.get(k) || []), c]); });
  return `${list.length === 0 ? '<p class="empty">No matches.</p>' : ''}${[...groups.entries()].map(([label, items]) => `<section><p class="heading">${label}</p>${items.map(c => listRow(c, 'text')).join('')}</section>`).join('')}`;
};
const sheetHtml = () => {
  const c = current(); const chips = consoleNamed().slice(0, 5);
  const head = S.editing ? inlineName('sheet-edit') : `<button type="button" class="sheet-title" title="Rename the current conversation" data-action="edit">${c ? mark(c.kind) : ''}<span class="${c && c.automatic ? 'automatic' : ''}"><strong>${esc(c ? c.name : 'Unnamed conversation')}</strong><small>${c && c.automatic ? 'automatic title · tap to name it' : 'current · tap to rename'}</small></span>${icon.pencil}</button>`;
  const chipRow = `<div class="chips" aria-label="Named here" ${S.query.trim() === '' ? '' : 'style="display:none"'}>${chips.length === 0 ? '<p class="empty">Nothing named here yet — tap the title above to name the current conversation.</p>' : chips.map(x => { const block = resumeBlock(x); return `<span class="chip${x.id === S.currentId ? ' current' : ''}"><button type="button" ${block ? 'disabled' : ''} title="${esc(block || `Resume “${x.name}”`)}" data-action="resume" data-id="${x.id}">${mark(x.kind)}${esc(x.name)}</button><button type="button" aria-label="Remove ${esc(x.name)} from named here" title="Remove from this list" data-action="forget" data-id="${x.id}">×</button></span>`; }).join('')}</div>`;
  return `<div class="sheet-wrap"><div class="backdrop dim" data-action="close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Conversations"><header class="sheet-head">${head}<button type="button" class="sheet-close" aria-label="Close conversations" data-action="close">×</button></header><input class="search" type="search" aria-label="Search conversations" placeholder="Search all named conversations" value="${esc(S.query)}" data-action="search">${chipRow}<div class="list" id="list">${sheetList()}</div></section></div>`;
};
const renderOverlay = () => {
  const host = document.getElementById('overlay');
  if (S.open === 'flyout') {
    host.innerHTML = `<div class="backdrop" data-action="close"></div><div class="flyout" role="dialog" aria-label="Conversations" id="flyout">${flyoutHtml()}</div>`;
    const anchor = document.getElementById('ctl').getBoundingClientRect(); const fly = document.getElementById('flyout');
    fly.style.right = `${window.innerWidth - anchor.left + 6}px`; fly.style.bottom = `${window.innerHeight - anchor.bottom}px`;
  } else if (S.open === 'dialog') { host.innerHTML = dialogHtml(); updateCount(); focusSearch(); }
  else if (S.open === 'sheet') host.innerHTML = sheetHtml();
  else host.innerHTML = '';
};
const updateCount = () => { const el = document.getElementById('count'); if (!el) return; const q = S.query.trim().toLowerCase(); el.textContent = `${allNamed().filter(c => matches(c, q, S.kind)).length} of ${allNamed().length} named · resuming opens it in this worktree`; };
const focusSearch = () => { const el = document.querySelector('.dialog .search'); if (el && window.innerWidth > 600) el.focus(); };
const refreshList = () => { const el = document.getElementById('list'); if (!el) return; el.innerHTML = S.open === 'sheet' ? sheetList() : dialogList(); updateCount(); const chips = document.querySelector('.chips'); if (chips) chips.style.display = S.query.trim() === '' ? '' : 'none'; };

// ---------- frame + bar ----------
const renderFrame = () => {
  const attention = S.scenario === 'working' ? 'working' : S.scenario === 'question' ? 'asking' : 'ready';
  document.getElementById('pane').innerHTML = `<b>Remote Agent Console</b>  prototype\n\n<i>•</i> Nothing is running; this pane is synthetic.\n<i>•</i> Agent is <em>${attention}</em>${S.scenario === 'duplicate' ? '; a second agent is open on this worktree' : ''}${S.scenario === 'scratch' ? ' in a scratch directory' : ''}.\n\n<em>◆</em> Waiting for a prompt…`;
  const c = current();
  document.getElementById('tabs').innerHTML = S.scenario === 'scratch' ? '<div class="active">✳ <svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>scratch</div><div>Cora</div><div class="plus">+</div>' : `<div class="active">${c ? kinds[c.kind].glyph : '✳'} <svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Cora${S.scenario === 'working' ? ' <span style="color:var(--peach)">●</span>' : ''}</div>${S.scenario === 'duplicate' ? '<div>◆ Cora (2)</div>' : ''}<div>Cora · named-sessions</div><div class="plus">+</div>`;
};
const renderBar = () => {
  document.getElementById('bar').innerHTML = `<div class="bar-wrap"><div class="bar" role="toolbar" aria-label="Prototype variants"><span class="bar-tag">PROTOTYPE</span><button type="button" aria-label="Previous variant" data-action="prev">←</button><strong>${S.variant} <span>(${variantName[S.variant]})</span></strong><button type="button" aria-label="Next variant" data-action="next">→</button><label>Scenario<select data-action="scenario">${Object.entries(scenarios).map(([k, v]) => `<option value="${k}" ${S.scenario === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label><button type="button" aria-pressed="${S.panel}" data-action="panel">State</button></div>${S.panel ? `<div class="state" role="region" aria-label="Prototype state"><h3>Console-named record (in memory)</h3><pre>${esc(JSON.stringify(record(), null, 1))}</pre><h3>Current</h3><pre>${esc(JSON.stringify(current(), null, 1))}</pre><h3>Log</h3><ol>${S.log.map(e => `<li><small>${e.at}</small>${esc(e.text)}</li>`).join('')}</ol></div>` : ''}</div>`;
};
const render = () => { renderFrame(); renderControl(); renderOverlay(); renderBar(); };

// ---------- events ----------
document.addEventListener('click', event => {
  const el = event.target.closest('[data-action]'); if (!el) return;
  const action = el.dataset.action;
  if (action === 'toggle') { S.open = S.open ? null : (S.variant === 'B' ? 'sheet' : 'flyout'); S.editing = false; S.query = ''; render(); }
  else if (action === 'close') { S.open = null; S.editing = false; S.query = ''; S.kind = 'all'; render(); }
  else if (action === 'dialog') { S.open = 'dialog'; S.query = ''; S.kind = 'all'; render(); }
  else if (action === 'resume') resume(el.dataset.id);
  else if (action === 'forget') forget(el.dataset.id);
  else if (action === 'edit') { S.editing = true; render(); const input = document.querySelector('.inline-name input'); if (input) { input.focus(); input.select(); } }
  else if (action === 'cancel-edit') { S.editing = false; render(); }
  else if (action === 'kind') { S.kind = el.dataset.kind; render(); focusSearch(); }
  else if (action === 'prev') setVariant(variants[(variants.indexOf(S.variant) + 2) % 3]);
  else if (action === 'next') setVariant(variants[(variants.indexOf(S.variant) + 1) % 3]);
  else if (action === 'panel') { S.panel = !S.panel; renderBar(); }
});
document.addEventListener('submit', event => {
  const form = event.target.closest('form[data-action="name"]'); if (!form) return;
  event.preventDefault(); const name = form.elements.name.value.trim(); if (name) nameCurrent(name);
});
document.addEventListener('input', event => { if (event.target.dataset.action === 'search') { S.query = event.target.value; refreshList(); } });
document.addEventListener('change', event => { if (event.target.dataset.action === 'scenario') setScenario(event.target.value); });
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') { if (S.editing) { S.editing = false; render(); } else if (S.open) { S.open = null; S.query = ''; S.kind = 'all'; render(); } return; }
  if (event.shiftKey || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.target.closest('input, textarea, select, [role="dialog"]')) return;
  if (event.key === 'ArrowLeft') setVariant(variants[(variants.indexOf(S.variant) + 2) % 3]);
  else if (event.key === 'ArrowRight') setVariant(variants[(variants.indexOf(S.variant) + 1) % 3]);
});
window.addEventListener('resize', () => { if (S.open === 'flyout') renderOverlay(); });
render();
</script>
</body>
</html>
