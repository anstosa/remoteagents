<!doctype html>
<!--
  PROTOTYPE — throwaway, and deliberately standalone. Four layouts for the "+" launcher
  flyout. No build step, no imports, no fetches, no fonts or assets from the server: open
  this file straight off disk and it renders.

  The question: how should a Worktree row read when it carries a name, a pinned/unpinned
  toggle, a Remove and a Launch — without the Pin floating beside a hole on Main rows, and
  without a pile of hover states?

  Switch variants with the bar at the bottom, the left/right arrow keys, or ?variant=A|B|C|D.
  Colours and metrics are copied from apps/web/src/styles.css (Catppuccin Mocha); if
  JetBrains Mono is not installed locally the text falls back to the system mono, which is
  a touch wider than the real console.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PROTOTYPE · launcher flyout</title>
<style>
:root {
  --crust: #11111b; --mantle: #181825; --base: #1e1e2e;
  --surface-0: #313244; --surface-1: #45475a; --surface-2: #585b70;
  --overlay-0: #6c7086; --overlay-2: #9399b2; --subtext-0: #a6adc8; --text: #cdd6f4;
  --lavender: #b4befe; --blue: #89b4fa; --green: #a6e3a1; --peach: #fab387;
  --red: #f38ba8; --mauve: #cba6f7;
  --control-radius: .3rem;
  --font-mono: "JetBrainsMono Nerd Font", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 0 0 6rem; background: var(--crust); color: var(--text); font-family: var(--font-mono); letter-spacing: .035em; }
button { font: inherit; letter-spacing: inherit; }

/* a slice of the real tab bar, so the flyout is not judged in a vacuum */
.tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--surface-1); background: var(--base); }
.tabs button { min-height: 2.6rem; padding: .5rem .75rem; border: 0; border-right: 1px solid var(--surface-1); background: transparent; color: var(--subtext-0); font-size: .78rem; font-weight: 700; cursor: pointer; }
.tabs button.active { background: var(--surface-0); color: var(--text); }
.tabs button.working { color: var(--green); }
.tabs .plus { margin-left: auto; border: 0; border-left: 1px solid color-mix(in srgb, var(--lavender) 45%, var(--surface-1)); background: linear-gradient(145deg, var(--mauve), var(--blue)); color: var(--crust); font-size: .9rem; padding: .5rem 1rem; }

/* the real flyout container, verbatim from .more-menu */
.menu { width: min(30rem, calc(100vw - 2rem)); margin: .6rem 1rem 0 auto; padding: .35rem; border: 1px solid var(--surface-1); border-radius: var(--control-radius); background: var(--mantle); box-shadow: 0 .7rem 1.8rem #11111bcc; font: 700 .78rem var(--font-mono); }

.project { margin-top: .35rem; }
.project-header { display: flex; align-items: baseline; gap: .5rem; padding: .45rem .45rem .2rem; color: var(--subtext-0); font-size: .64rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.project-header > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prune { flex: 0 0 auto; padding: .18rem .5rem; border: 1px solid color-mix(in srgb, var(--peach) 45%, transparent); border-radius: var(--control-radius); background: transparent; color: var(--peach); font-size: .62rem; letter-spacing: 0; text-transform: none; cursor: pointer; white-space: nowrap; }

.new-worktree { display: flex; align-items: center; width: 100%; margin-top: .15rem; padding: .35rem .45rem; border: 0; border-radius: calc(var(--control-radius) - .1rem); background: transparent; color: var(--lavender); font-size: .7rem; text-align: left; cursor: pointer; }
.new-worktree:hover { background: color-mix(in srgb, var(--lavender) 14%, transparent); }

/* One Pin toggle for every variant. The whole difference between the two states is the
   fill, it is visible without hovering, and nothing else on the row changes colour. */
.pin { display: inline-flex; flex: 0 0 1.7rem; width: 1.7rem; height: 1.7rem; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--surface-1); border-radius: var(--control-radius); background: transparent; color: var(--overlay-2); cursor: pointer; }
.pin.on { border-color: var(--lavender); background: var(--lavender); color: var(--crust); }
.pin.on svg { fill: color-mix(in srgb, var(--crust) 35%, transparent); }

/* Remove always keeps its column; where it cannot act it is disabled, never blank */
.remove { display: inline-flex; flex: 0 0 1.7rem; width: 1.7rem; height: 1.7rem; align-items: center; justify-content: center; padding: 0; border: 1px solid transparent; border-radius: var(--control-radius); background: transparent; color: var(--overlay-2); cursor: pointer; }
.remove:disabled { opacity: .28; cursor: not-allowed; }
.remove:not(:disabled):hover { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
.pin:not(.on):hover, .chevron:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }

.pin svg, .remove svg, .chevron svg { width: .95rem; height: .95rem; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }

/* the Launch split button, and the width that keeps every row's columns aligned */
.launch { display: inline-flex; flex: 0 0 auto; min-width: 10rem; align-items: stretch; }
.launch > .primary { display: flex; flex: 1; align-items: center; justify-content: center; gap: .35rem; min-height: 1.8rem; padding: .25rem .6rem; border: 1px solid color-mix(in srgb, var(--lavender) 54%, transparent); border-right: 0; border-radius: var(--control-radius) 0 0 var(--control-radius); background: linear-gradient(135deg, var(--mauve), var(--blue)); color: var(--crust); font-size: .64rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
.launch > .chev { display: inline-flex; flex: 0 0 1.7rem; align-items: center; justify-content: center; padding: 0; border: 1px solid color-mix(in srgb, var(--lavender) 54%, transparent); border-left: 1px solid color-mix(in srgb, var(--crust) 30%, transparent); border-radius: 0 var(--control-radius) var(--control-radius) 0; background: linear-gradient(135deg, var(--mauve), var(--blue)); color: var(--crust); cursor: pointer; }
.launch > .chev svg { width: .9rem; height: .9rem; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.wake { min-width: 10rem; min-height: 1.8rem; padding: .25rem .6rem; border: 1px solid color-mix(in srgb, var(--lavender) 54%, transparent); border-radius: var(--control-radius); background: linear-gradient(135deg, var(--mauve), var(--blue)); color: var(--crust); font-size: .64rem; font-weight: 700; cursor: pointer; }
.mark { display: inline-grid; width: 1rem; height: 1rem; place-items: center; border-radius: .2rem; background: color-mix(in srgb, var(--crust) 22%, transparent); font-size: .6rem; }

/* ------------------------------------------------------------------- A — Pin gutter */
.a-row { display: flex; align-items: center; gap: .5rem; padding: .3rem .45rem; border-radius: calc(var(--control-radius) - .1rem); }
.a-row:hover { background: color-mix(in srgb, var(--surface-0) 60%, transparent); }
.a-gutter, .a-slot { flex: 0 0 1.7rem; }
.a-name { flex: 1; min-width: 0; overflow: hidden; font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }

/* ----------------------------------------------------------------- B — Pinned first */
.b-group { margin: .5rem 0 .1rem; padding: 0 .45rem; color: var(--overlay-0); font-size: .6rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.b-row { display: flex; align-items: center; gap: .5rem; padding: .3rem .45rem; border-left: 2px solid transparent; border-radius: calc(var(--control-radius) - .1rem); }
.b-row.kept { border-left-color: var(--lavender); }
.b-row:hover { background: color-mix(in srgb, var(--surface-0) 60%, transparent); }
.b-name { flex: 1; min-width: 0; overflow: hidden; font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }

/* ---------------------------------------------------------------- C — Row launches */
.c-row { display: flex; align-items: center; gap: .3rem; padding: .1rem .45rem; border-radius: calc(var(--control-radius) - .1rem); }
.c-row:hover { background: color-mix(in srgb, var(--surface-0) 60%, transparent); }
.c-launch { display: flex; flex: 1; min-width: 0; align-items: center; gap: .55rem; padding: .45rem; border: 0; border-radius: calc(var(--control-radius) - .1rem); background: transparent; color: var(--text); font-size: .78rem; font-weight: 700; text-align: left; cursor: pointer; }
.c-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-kind { color: var(--overlay-0); font-size: .66rem; font-weight: 600; }
.chevron { display: inline-flex; flex: 0 0 1.7rem; width: 1.7rem; height: 1.7rem; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: var(--control-radius); background: transparent; color: var(--overlay-2); cursor: pointer; }
/* outside the gradient button the glyph carries the kind's own colour, as it does in the app */
.c-row .mark { flex: 0 0 1.15rem; width: 1.15rem; height: 1.15rem; font-size: .7rem; background: color-mix(in srgb, var(--kind) 22%, transparent); color: var(--kind); }
.c-row .mark[data-kind="codex"] { --kind: var(--green); }
.c-row .mark[data-kind="claude"] { --kind: var(--peach); }
.c-slot { flex: 0 0 1.7rem; }

/* ------------------------------------------- E — Combined (B's controls, C's ordering) */
.e-row { display: flex; align-items: center; gap: .5rem; padding: .3rem .45rem; border-radius: calc(var(--control-radius) - .1rem); }
.e-row:hover { background: color-mix(in srgb, var(--surface-0) 60%, transparent); }
.e-name { flex: 1; min-width: 0; overflow: hidden; font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------------- D — Two lines */
.d-row { display: flex; align-items: center; gap: .5rem; padding: .35rem .45rem; border-radius: calc(var(--control-radius) - .1rem); }
.d-row:hover { background: color-mix(in srgb, var(--surface-0) 60%, transparent); }
.d-copy { display: grid; flex: 1; min-width: 0; gap: .1rem; }
.d-copy > strong { overflow: hidden; font-size: .8rem; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
.d-copy > small { color: var(--overlay-0); font-size: .62rem; font-weight: 600; }

/* ---------------------------------------------------------------- the switcher bar */
.switcher { position: fixed; bottom: 1rem; left: 50%; z-index: 999; display: flex; align-items: center; gap: .75rem; padding: .4rem .5rem; border: 1px solid var(--surface-2); border-radius: 999px; background: var(--crust); box-shadow: 0 .5rem 1.5rem #000a; transform: translateX(-50%); }
.switcher > span { min-width: 11rem; font-size: .74rem; text-align: center; }
.switcher > button { width: 2rem; height: 2rem; border: 0; border-radius: 999px; background: var(--surface-0); color: var(--text); cursor: pointer; }
</style>
</head>
<body>
<nav class="tabs" aria-label="Agents and worktrees">
  <button type="button" class="active">main</button>
  <button type="button" class="working">yield-pane-size</button>
  <button type="button">ticket-cli</button>
  <button type="button" class="plus" aria-expanded="true">+</button>
</nav>
<div id="stage"></div>
<div class="switcher">
  <button type="button" id="prev" aria-label="Previous variant">←</button>
  <span id="label"></span>
  <button type="button" id="next" aria-label="Next variant">→</button>
</div>

<script>
const glyph = { codex: '◆', claude: '✳' };
const kindName = { codex: 'Codex', claude: 'Claude' };

const projects = [
  { label: 'Remote Agent Console', stale: 1, rows: [
    { id: 'rac-main', name: 'main', kind: 'codex', main: true },
    { id: 'rac-font', name: 'terminal-font-size', kind: 'claude' },
    { id: 'rac-pane', name: 'yield-pane-size', kind: 'codex' },
    { id: 'rac-omx', name: 'omx-adapter', kind: 'codex', locked: true },
    { id: 'rac-sleep', name: 'projects-cutover', kind: 'codex', sleeping: true }
  ] },
  { label: 'dotfiles', rows: [
    { id: 'dots-main', name: 'main', kind: 'codex', main: true },
    { id: 'dots-ticket', name: 'ticket-cli', kind: 'codex' }
  ] }
];

// every variant shares one pinned set, so flipping between them compares like with like
const pinned = new Set(['rac-main', 'rac-pane', 'rac-sleep', 'dots-ticket']);

// why Remove cannot act on this Worktree, or undefined when it can go
const removeReason = row => row.main ? 'The main worktree cannot be removed'
  : row.locked ? 'Locked worktrees cannot be removed' : undefined;

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of [].concat(children)) node.append(child);
  return node;
};
const svg = paths => {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  node.setAttribute('viewBox', '0 0 24 24');
  node.setAttribute('aria-hidden', 'true');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', paths);
  node.append(path);
  return node;
};
const pinPath = 'M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6ZM12 15v5';
const trashPath = 'M4 7h16M10 7V4.5h4V7M6.5 7l.9 12.1a1 1 0 0 0 1 .9h7.2a1 1 0 0 0 1-.9L17.5 7M10 11v5M14 11v5';
const chevronPath = 'm6 9 6 6 6-6';

const pinToggle = (row, extraClass = '') => {
  const on = pinned.has(row.id);
  const button = el('button', {
    type: 'button',
    className: `pin${on ? ' on' : ''} ${extraClass}`.trim(),
    title: `${on ? 'Unpin' : 'Pin'} ${row.name}`,
    ariaLabel: `${on ? 'Unpin' : 'Pin'} ${row.name}`
  }, svg(pinPath));
  button.setAttribute('aria-pressed', String(on));
  button.onclick = () => { pinned.has(row.id) ? pinned.delete(row.id) : pinned.add(row.id); render(); };
  return button;
};

const removeButton = (row, extraClass = '') => {
  const reason = removeReason(row);
  const button = el('button', {
    type: 'button',
    className: `remove ${extraClass}`.trim(),
    disabled: reason !== undefined,
    title: reason ?? `Remove ${row.name}`,
    ariaLabel: `Remove ${row.name}`
  }, svg(trashPath));
  return button;
};

// `showMark` is what variant E drops: the label already names the kind, so the glyph inside
// the button is saying it twice
const launch = (row, showMark = true) => {
  if (row.sleeping) return el('button', { type: 'button', className: 'wake', textContent: 'Wake up' });
  const primary = el('button', { type: 'button', className: 'primary' }, [
    ...(showMark ? [el('span', { className: 'mark', textContent: glyph[row.kind] })] : []),
    el('span', { textContent: `Launch ${kindName[row.kind]}` })
  ]);
  const chev = el('button', { type: 'button', className: 'chev', ariaLabel: 'Choose agent' }, svg(chevronPath));
  return el('span', { className: 'launch' }, [primary, chev]);
};

const header = project => el('div', { className: 'project-header' }, [
  el('span', { textContent: project.label }),
  ...(project.stale ? [el('button', { type: 'button', className: 'prune', textContent: `${project.stale} stale · Prune` })] : [])
]);
const newWorktree = () => el('button', { type: 'button', className: 'new-worktree', textContent: '+ New worktree…' });
const section = children => el('section', { className: 'project' }, children);

// -----------------------------------------------------------------------------------
// A — Pin gutter. The toggle leads the row in a fixed column, the way a file list puts a
// star or a checkbox first. Remove always occupies its own column, so nothing is ever
// stranded next to a hole.
// -----------------------------------------------------------------------------------
const variantA = () => [
  el('div', { className: 'a-row' }, [
    el('span', { className: 'a-gutter' }),
    el('span', { className: 'a-name', textContent: '~ Scratch' }),
    el('span', { className: 'a-slot' }),
    launch({ kind: 'codex' })
  ]),
  ...projects.map(project => section([
    header(project),
    ...project.rows.map(row => el('div', { className: 'a-row' }, [
      pinToggle(row, 'a-gutter'),
      el('span', { className: 'a-name', textContent: row.name }),
      removeButton(row, 'a-slot'),
      launch(row)
    ])),
    newWorktree()
  ]))
];

// -----------------------------------------------------------------------------------
// B — Pinned first. Pinned rows are grouped above the rest under their own label, so the
// state reads from the row's position before any icon is decoded.
// -----------------------------------------------------------------------------------
const variantB = () => {
  const row = item => el('div', { className: `b-row${pinned.has(item.id) ? ' kept' : ''}` }, [
    el('span', { className: 'b-name', textContent: item.name }),
    pinToggle(item),
    removeButton(item),
    launch(item)
  ]);
  const group = (rows, label) => rows.length === 0 ? []
    : [el('p', { className: 'b-group', textContent: label }), ...rows.map(row)];
  return [
    el('div', { className: 'b-row' }, [el('span', { className: 'b-name', textContent: '~ Scratch' }), launch({ kind: 'codex' })]),
    ...projects.map(project => section([
      header(project),
      ...group(project.rows.filter(item => pinned.has(item.id)), 'Pinned'),
      ...group(project.rows.filter(item => !pinned.has(item.id)), 'Available'),
      newWorktree()
    ]))
  ];
};

// -----------------------------------------------------------------------------------
// C — Row launches. The row itself is the primary action, so the flyout is a plain list
// instead of a wall of gradient buttons: kind glyph, name, the kind in muted text, then a
// chevron for a different kind and the two small utilities.
// -----------------------------------------------------------------------------------
const variantC = () => {
  const kindMark = kind => {
    const node = el('span', { className: 'mark', textContent: glyph[kind] });
    node.dataset.kind = kind;
    return node;
  };
  const row = item => el('div', { className: 'c-row' }, [
    el('button', { type: 'button', className: 'c-launch' }, [
      kindMark(item.kind),
      el('span', { className: 'c-name', textContent: item.name }),
      el('span', { className: 'c-kind', textContent: item.sleeping ? 'Asleep · wake' : kindName[item.kind] })
    ]),
    el('button', { type: 'button', className: 'chevron', ariaLabel: `Choose agent for ${item.name}` }, svg(chevronPath)),
    pinToggle(item),
    removeButton(item)
  ]);
  return [
    el('div', { className: 'c-row' }, [
      el('button', { type: 'button', className: 'c-launch' }, [
        kindMark('codex'),
        el('span', { className: 'c-name', textContent: '~ Scratch' }),
        el('span', { className: 'c-kind', textContent: 'Codex' })
      ]),
      el('button', { type: 'button', className: 'chevron', ariaLabel: 'Choose agent' }, svg(chevronPath)),
      el('span', { className: 'c-slot' }),
      el('span', { className: 'c-slot' })
    ]),
    ...projects.map(project => section([header(project), ...project.rows.map(row), newWorktree()]))
  ];
};

// -----------------------------------------------------------------------------------
// D — Two lines. A muted second line spells the state out in words, so nothing depends on
// reading an icon's fill.
// -----------------------------------------------------------------------------------
const variantD = () => {
  const meta = item => [
    pinned.has(item.id) ? 'Pinned' : undefined,
    item.sleeping ? 'Asleep' : kindName[item.kind],
    item.locked ? 'Locked by git' : undefined,
    item.main ? 'Main worktree' : undefined
  ].filter(Boolean).join(' · ');
  const row = item => el('div', { className: 'd-row' }, [
    el('span', { className: 'd-copy' }, [
      el('strong', { textContent: item.name }),
      el('small', { textContent: meta(item) })
    ]),
    pinToggle(item),
    removeButton(item),
    launch(item)
  ]);
  return [
    el('div', { className: 'd-row' }, [
      el('span', { className: 'd-copy' }, [el('strong', { textContent: '~ Scratch' }), el('small', { textContent: 'Codex · no worktree' })]),
      launch({ kind: 'codex' })
    ]),
    ...projects.map(project => section([header(project), ...project.rows.map(row), newWorktree()]))
  ];
};

// -----------------------------------------------------------------------------------
// E — Combined. B's right-hand controls (pin, then trash, then Launch) over C's flat
// ordering: no pinned/available grouping, no left stripe, no leading glyph. The row opens
// with the name, and the Launch button drops the kind mark its own label already carries.
// -----------------------------------------------------------------------------------
const variantE = () => [
  el('div', { className: 'e-row' }, [
    el('span', { className: 'e-name', textContent: '~ Scratch' }),
    launch({ kind: 'codex' }, false)
  ]),
  ...projects.map(project => section([
    header(project),
    ...project.rows.map(row => el('div', { className: 'e-row' }, [
      el('span', { className: 'e-name', textContent: row.name }),
      pinToggle(row),
      removeButton(row),
      launch(row, false)
    ])),
    newWorktree()
  ]))
];

const variants = [
  { key: 'E', name: 'Combined (B controls, C order)', build: variantE },
  { key: 'A', name: 'Pin gutter', build: variantA },
  { key: 'B', name: 'Pinned first', build: variantB },
  { key: 'C', name: 'Row launches', build: variantC },
  { key: 'D', name: 'Two lines', build: variantD }
];

let index = Math.max(0, variants.findIndex(v => v.key === (new URLSearchParams(location.search).get('variant') ?? 'E').toUpperCase()));

function render() {
  const variant = variants[index];
  const stage = document.getElementById('stage');
  stage.replaceChildren(el('div', { className: 'menu', role: 'group', ariaLabel: 'Agent launcher' }, variant.build()));
  document.getElementById('label').textContent = `${variant.key} · ${variant.name}`;
  const url = new URL(location.href);
  url.searchParams.set('variant', variant.key);
  history.replaceState(null, '', url);
}

const go = step => { index = (index + step + variants.length) % variants.length; render(); };
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') go(-1);
  if (event.key === 'ArrowRight') go(1);
});
render();
</script>
</body>
</html>
